<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Live Coder">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Hockey Live Coder</title>
<style>
:root{--home:#00b4d8;--homet:#d3f2f9;--away:#ff9f1c;--awayt:#ffe8c4;--ink:#0f172a;--mut:#5b6777;--bg:#e9edf2;--card:#fff;--line:#cfd6df}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{font:16px/1.15 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;margin:0;cursor:pointer}
.coder{height:100vh;height:100dvh;display:grid;grid-template-rows:auto 1fr auto;gap:8px;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:0 4px}
.tn{display:flex;align-items:center;gap:12px;font-weight:800;font-size:clamp(17px,2.5vw,30px);min-width:0}
.tn span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tn .sc{font-size:clamp(30px,4.6vw,52px);font-variant-numeric:tabular-nums}
.tn.r{justify-content:flex-end}
.dot{flex:none;width:16px;height:16px;border-radius:5px;background:var(--tc)}
.clock{text-align:center;min-width:150px}
.clock b{display:block;font-size:clamp(22px,3.3vw,38px);font-variant-numeric:tabular-nums}
.clock span{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.main{display:grid;grid-template-columns:1fr clamp(124px,14vw,172px) 1fr;gap:8px;min-height:0}
.panel{--tc:var(--home);--tt:var(--homet);display:flex;flex-direction:column;gap:7px;min-height:0;background:var(--card);border-radius:14px;padding:8px;border-top:7px solid var(--tc)}
.panel.away,.tn.away{--tc:var(--away);--tt:var(--awayt)}
.tn{--tc:var(--home)}
.row{display:flex;flex-direction:column;flex:1;min-height:0}
.row.lost{flex:1.9}
.rl{font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin:0 2px 3px}
.g{display:grid;gap:6px;flex:1;min-height:0}
.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.lostg{grid-template-columns:auto repeat(4,1fr);grid-template-rows:1fr 1fr}
.lostg .lab{display:flex;align-items:center;font-size:12px;font-weight:800;color:var(--mut);width:64px;line-height:1.1}
.b{border-radius:12px;font-weight:800;font-size:clamp(15px,2vw,23px);background:var(--tt);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px 4px;min-height:40px;line-height:1.05;transition:transform .05s}
.b small{font-size:.62em;font-weight:700;opacity:.75}
.b.goal{background:var(--tc)}
.b.unf{background:#e3e8ef}
.b:active,.b.hit{transform:scale(.96);outline:4px solid var(--ink)}
.mid{display:flex;flex-direction:column;gap:7px;min-height:0}
.mid .b{flex:1;background:var(--card);border:2px solid var(--line);font-size:clamp(14px,1.7vw,19px)}
.mid .b.q{flex:1.6;background:var(--ink);color:#fff;border-color:var(--ink);font-size:clamp(17px,2.2vw,24px)}
.mid .b.flag{background:#fde68a;border-color:#fcd34d}.mid .b.good{background:#bbf7d0;border-color:#86efac}.mid .b.bad{background:#fecaca;border-color:#fca5a5}
.mid .b:disabled{opacity:.4}
.toast{flex:none;height:44px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;font-weight:800;border-radius:10px;padding:0 4px;color:var(--mut)}
.toast.on{background:var(--ink);color:#fff}
.tape{display:flex;gap:6px;overflow:hidden;min-height:38px;align-items:stretch}
.chip{flex:none;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:10px;padding:0 4px 0 10px;font-size:14px;font-weight:600;border-left:6px solid var(--line);white-space:nowrap}
.chip.Home{border-left-color:var(--home)}.chip.Away{border-left-color:var(--away)}
.chip i{font-style:normal;color:var(--mut);font-variant-numeric:tabular-nums}
.chip button{background:none;font-size:20px;line-height:1;padding:6px 8px;color:var(--mut)}
.tape .none{color:var(--mut);font-size:14px;align-self:center;padding-left:6px}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.card{background:var(--card);border-radius:18px;padding:22px;width:min(760px,100%);max-height:100%;overflow:auto}
.card h2{margin:0 0 4px;font-size:26px}.card p{margin:6px 0 14px;color:var(--mut);font-size:15px;line-height:1.35}
table{width:100%;border-collapse:collapse;font-size:20px;font-variant-numeric:tabular-nums}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;font-weight:600}
thead th{font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
td.h{color:#0786a3;font-weight:800}td.a{color:#b86a00;font-weight:800}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{border-radius:12px;padding:15px 20px;font-weight:800;font-size:18px;background:#e3e8ef}
.btn.p{background:var(--ink);color:#fff}.btn.d{background:#fee2e2;color:#991b1b}
.setup{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
label{display:block;font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);margin:14px 0 5px}
input{width:100%;font:inherit;font-size:22px;font-weight:700;padding:13px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:56px;text-align:left}
input::-webkit-date-and-time-value{text-align:left}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.card>div,.two>div{min-width:0}
.saved{margin-top:20px;border-top:1px solid var(--line);padding-top:12px}
.saved div{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:16px}
.saved div span{flex:1}
.saved .btn{padding:9px 14px;font-size:15px}
.turn{display:none}
@media (orientation:portrait) and (max-width:900px){.turn{display:flex;position:fixed;inset:0;z-index:9;background:var(--ink);color:#fff;align-items:center;justify-content:center;font-size:24px;font-weight:800;text-align:center;padding:30px}}
pre.st{display:none}
</style>
</head>
<body>
<div id="app"></div>
<div class="turn">Turn the tablet sideways to code.</div>
<script>
(() => {
'use strict';
const KEY = 'livecoder.v1.current', DONE = 'livecoder.v1.matches';
const LEAD = 5, LAG = 5, PC_LAG = 35;          // seconds kept before and after each tap
let fake = null, noSave = false;
const now = () => fake !== null ? fake : Date.now();

// The event names and labels are the ones in the analyst's own coded files.
const KINDS = {
  entry23: {code: s => s + ' - 23 Entry', name: '23 Entry'},
  dentry:  {code: s => s + ' - D entry', name: 'D Entry'},
  chance:  {code: s => s + ' - Chance', name: 'Chance'},
  pc:      {code: s => s + ' - PC', name: 'PC'},
  lc:      {code: s => s + ' - LC', name: 'LC'},
  freehit: {code: s => s + ' - 23 Free Hit', name: 'Free hit in 23'},
  goal:    {code: s => s + ' Goals', name: 'GOAL'},
  toF:     {code: s => s + ' Forced TO', name: 'Lost under pressure'},
  toU:     {code: s => s + ' Unforced TO', name: 'Lost unforced'},
  flag:    {code: () => 'Flag', name: 'Flag'},
  good:    {code: () => 'Good', name: 'Good'},
  bad:     {code: () => 'Bad', name: 'Bad'},
  qend:    {code: () => 'Quarter end', name: 'Quarter end'},
};
const BANDS = ['Home 23', 'HM 3rd', 'AM 3rd', 'Away 23'];     // from the Home goal outward
const BAND_NAMES = ['Own 23', 'Own half', 'Opp. half', 'Att. 23'];
const fileBand = (side, i) => side === 'Home' ? BANDS[i] : BANDS[3 - i];

let S = null, hist = [], overlay = null, toastTimer = null, lastTap = ['', 0];

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const mmss = s => { s = Math.max(0, Math.floor(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const secs = () => S && S.t0 !== null ? (now() - S.t0) / 1000 : 0;
const teamName = side => side === 'Home' ? S.home : S.away;
const today = () => { const d = new Date(now()); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

function fresh(home, away, date) {
  return {id: 'm' + now().toString(36), date, home, away, flipped: false, t0: null, q: 0, live: false, qs: {}, events: [], seq: 0, offset: 0, finished: false};
}
function save() {
  if (noSave) return;
  try { S ? localStorage.setItem(KEY, JSON.stringify(S)) : localStorage.removeItem(KEY); } catch (e) {}
}
function saved() { try { return JSON.parse(localStorage.getItem(DONE) || '[]'); } catch (e) { return []; } }
function snapshot() { hist.push(JSON.stringify(S)); if (hist.length > 80) hist.shift(); }

function startQuarter(q) { if (q === 1) S.t0 = now(); S.q = q; S.live = true; S.qs[q] = secs(); }

function quarterTap() {
  if (S.finished) return;
  snapshot();
  if (S.q === 0) startQuarter(1);
  else if (!S.live) startQuarter(S.q + 1);
  else {
    S.live = false;
    if (S.q < 4) S.events.push({id: ++S.seq, t: secs(), kind: 'qend', side: null, q: S.q});
    else S.finished = true;
  }
  commit();
}

function add(kind, side, extra) {
  snapshot();
  // A team event starts the clock or the next quarter if the coder forgot to.
  if (side && S.q === 0) startQuarter(1);
  else if (side && !S.live && !S.finished && S.q < 4) startQuarter(S.q + 1);
  if (S.q === 0) startQuarter(1);
  const e = Object.assign({id: ++S.seq, t: secs(), kind, side: side || null, q: S.q}, extra || {});
  S.events.push(e);
  commit(e);
  return e;
}
function remove(id) { snapshot(); S.events = S.events.filter(e => e.id !== id); commit(); }
function undo() { if (!hist.length) return; S = JSON.parse(hist.pop()); commit(); }

function describe(e) {
  const K = KINDS[e.kind];
  let s = (e.side ? teamName(e.side) + ' · ' : '') + K.name;
  if (e.loc) s += ' · ' + e.loc;
  if (e.band !== undefined) s += ' · ' + BAND_NAMES[e.band];
  if (e.gf) s += ' · ' + (e.gf === 'Field Goal' ? 'field' : 'PC / stroke');
  return s;
}

function commit(e) {
  save(); render();
  if (!e) return;
  try { if (!noSave && navigator.vibrate) navigator.vibrate(18); } catch (err) {}
  const t = document.getElementById('toast');
  if (t) { t.textContent = describe(e); t.className = 'toast on'; clearTimeout(toastTimer); toastTimer = setTimeout(() => { const x = document.getElementById('toast'); if (x) { x.className = 'toast'; x.textContent = ''; } }, 1600); }
  const hit = document.querySelector('[data-key="' + keyOf(e.kind, e.side, e.loc !== undefined ? e.loc : e.band !== undefined ? e.band : e.gf) + '"]');
  if (hit) { hit.classList.add('hit'); setTimeout(() => hit.classList.remove('hit'), 170); }
}
function keyOf(k, s, x) { return [k, s || '', x === undefined || x === null ? '' : String(x)].join('|'); }

// ---------- the file ----------
function counts(q) {
  const z = () => ({entry23: 0, dentry: 0, chance: 0, pc: 0, lc: 0, freehit: 0, goal: 0, lost: 0});
  const c = {Home: z(), Away: z()};
  for (const e of S.events) {
    if (!e.side || (q && e.q !== q)) continue;
    if (e.kind === 'toF' || e.kind === 'toU') c[e.side].lost++; else if (e.kind in c[e.side]) c[e.side][e.kind]++;
  }
  return c;
}
function toXML(M) {
  const off = +M.offset || 0, f = n => String(Math.round(n * 1000) / 1000), rows = [], out = [];
  let id = 0;
  const inst = (start, end, code, labels) => {
    if (!rows.includes(code)) rows.push(code);
    out.push('<instance><ID>' + (++id) + '</ID><start>' + f(Math.max(0, start + off)) + '</start><end>' + f(end + off) + '</end><code>' + esc(code) + '</code>' +
      labels.map(l => '<label><text>' + esc(l[0]) + '</text>' + (l[1] ? '<group>' + l[1] + '</group>' : '') + '</label>').join('') + '</instance>');
  };
  for (const e of M.events) {
    const code = KINDS[e.kind].code(e.side), Q = ['Q' + e.q];
    if (e.kind === 'qend') { inst(e.t, M.qs[e.q + 1] !== undefined ? M.qs[e.q + 1] : e.t + 1, code, []); continue; }
    const labels = [Q];
    if (e.loc) labels.push([e.loc, 'Location']);
    if (e.band !== undefined) labels.push([fileBand(e.side, e.band), 'Turnover location']);
    if (e.gf) labels.push([e.gf, 'Goal From']);
    if (e.kind === 'pc') inst(e.t, e.t + 0.5, e.side + ' PC Acquisition', [Q]);
    inst(e.t - LEAD, e.t + (e.kind === 'pc' ? PC_LAG : LAG), code, labels);
  }
  const rgb = c => c.startsWith('Home') ? [0, 46260, 55512] : c.startsWith('Away') ? [65535, 40863, 7196] : [32896, 32896, 32896];
  return '<?xml version="1.0" encoding="utf-8"?>\n<file>\n<ALL_INSTANCES>\n' + out.join('\n') + '\n</ALL_INSTANCES>\n<ROWS>\n' +
    rows.map(c => { const k = rgb(c); return '<row><code>' + esc(c) + '</code><R>' + k[0] + '</R><G>' + k[1] + '</G><B>' + k[2] + '</B></row>'; }).join('\n') + '\n</ROWS>\n</file>\n';
}
const clean = s => String(s).replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim();
const fileName = M => clean(M.date + ' ' + M.home + ' v ' + M.away) + '.xml';

function download(xml, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([xml], {type: 'text/xml'}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
async function send(M, forceSave) {
  const xml = toXML(M), name = fileName(M);
  if (!forceSave) {
    try {
      const file = new File([xml], name, {type: 'text/xml'});
      if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: name}); return; }
    } catch (err) { if (err && err.name === 'AbortError') return; }
  }
  download(xml, name);
}

// ---------- screens ----------
function setupScreen() {
  const list = saved();
  return '<div class="setup"><div class="card"><h2>New match</h2>' +
    '<p>Type the two teams, then code. Every tap is saved on this tablet as you go.</p>' +
    '<div class="two"><div><label>Home team</label><input id="f-home" autocomplete="off" autocapitalize="words" placeholder="Kestrels"></div>' +
    '<div><label>Away team</label><input id="f-away" autocomplete="off" autocapitalize="words" placeholder="Northfield"></div></div>' +
    '<label>Date</label><input id="f-date" type="date" value="' + today() + '">' +
    '<div class="acts"><button class="btn p" data-a="begin">Start coding</button></div>' +
    (list.length ? '<div class="saved"><label>Matches on this tablet</label>' + list.map((m, i) =>
      '<div><span>' + esc(m.date + ' · ' + m.home + ' ' + m.score + ' ' + m.away) + '</span><button class="btn" data-a="resend" data-i="' + i + '">Send file</button><button class="btn d" data-a="forget" data-i="' + i + '">Delete</button></div>').join('') + '</div>' : '') +
    '</div></div>';
}

function panel(side, onLeft) {
  const k = (kind, x) => 'data-a="ev" data-k="' + kind + '" data-s="' + side + '" data-key="' + keyOf(kind, side, x) + '"';
  const three = (kind, title) => '<div class="row"><div class="rl">' + title + '</div><div class="g g3">' +
    ['Left', 'Middle', 'Right'].map(l => '<button class="b" ' + k(kind, l) + ' data-loc="' + l + '">' + l + '</button>').join('') + '</div></div>';
  const order = onLeft ? [0, 1, 2, 3] : [3, 2, 1, 0];
  const lostRow = (kind, label, cls) => '<div class="lab">' + label + '</div>' +
    order.map(i => '<button class="b ' + cls + '" ' + k(kind, i) + ' data-band="' + i + '">' + BAND_NAMES[i] + '</button>').join('');
  return '<div class="panel ' + (side === 'Away' ? 'away' : '') + '">' +
    three('entry23', '23 entry · which side') + three('dentry', 'D entry · which side') +
    '<div class="row"><div class="rl">In the 23</div><div class="g g4">' +
      [['chance', 'Chance'], ['pc', 'PC'], ['lc', 'LC'], ['freehit', 'Free hit']].map(x => '<button class="b" ' + k(x[0], '') + '>' + x[1] + '</button>').join('') + '</div></div>' +
    '<div class="row"><div class="rl">Goal</div><div class="g g2">' +
      '<button class="b goal" ' + k('goal', 'Field Goal') + ' data-gf="Field Goal">GOAL<small>field</small></button>' +
      '<button class="b goal" ' + k('goal', 'PC/PS') + ' data-gf="PC/PS">GOAL<small>PC / stroke</small></button></div></div>' +
    '<div class="row lost"><div class="rl">Ball lost · tap where</div><div class="g lostg">' +
      lostRow('toF', 'Under pressure', '') + lostRow('toU', 'Unforced', 'unf') + '</div></div></div>';
}

function coderScreen() {
  const c = counts(0), L = S.flipped ? 'Away' : 'Home', R = S.flipped ? 'Home' : 'Away';
  const qb = S.finished ? 'Full time' : S.q === 0 ? 'Start Q1' : S.live ? 'End Q' + S.q : 'Start Q' + (S.q + 1);
  const head = (side, right) => '<div class="tn ' + (side === 'Away' ? 'away ' : '') + (right ? 'r' : '') + '">' +
    (right ? '<span class="sc">' + c[side].goal + '</span><span class="n">' + esc(teamName(side)) + '</span><span class="dot"></span>'
           : '<span class="dot"></span><span class="n">' + esc(teamName(side)) + '</span><span class="sc">' + c[side].goal + '</span>') + '</div>';
  const tape = S.events.filter(e => e.kind !== 'qend').slice(-6).reverse().map(e =>
    '<div class="chip ' + (e.side || '') + '"><i>Q' + e.q + ' ' + mmss(e.t) + '</i>' + esc(describe(e)) + '<button data-a="del" data-id="' + e.id + '" aria-label="Delete">×</button></div>').join('');
  return '<div class="coder"><div class="top">' + head(L, false) +
    '<div class="clock"><b id="clk"></b><span id="clk2"></span></div>' + head(R, true) + '</div>' +
    '<div class="main">' + panel(L, true) +
    '<div class="mid"><button class="b q" data-a="quarter"' + (S.finished ? ' disabled' : '') + '>' + qb + '</button>' +
      '<div class="toast" id="toast"></div>' +
      '<button class="b flag" data-a="mark" data-k="flag" data-key="' + keyOf('flag') + '">Flag</button>' +
      '<button class="b good" data-a="mark" data-k="good" data-key="' + keyOf('good') + '">Good</button>' +
      '<button class="b bad" data-a="mark" data-k="bad" data-key="' + keyOf('bad') + '">Bad</button>' +
      '<button class="b" data-a="undo"' + (hist.length ? '' : ' disabled') + '>Undo</button>' +
      '<button class="b" data-a="numbers">Numbers</button>' +
      '<button class="b" data-a="flip">Swap ends</button>' +
      '<button class="b" data-a="finish">Finish</button></div>' +
    panel(R, false) + '</div>' +
    '<div class="tape">' + (tape || '<span class="none">Nothing coded yet. The first tap starts the clock.</span>') + '</div></div>' +
    (overlay === 'numbers' ? numbersCard() : overlay === 'finish' ? finishCard() : '');
}

function numbersCard() {
  const q = S.q || 1, a = counts(q), m = counts(0);
  const rows = [['23 entries', 'entry23'], ['D entries', 'dentry'], ['Chances', 'chance'], ['PCs', 'pc'], ['LCs', 'lc'], ['Free hits in 23', 'freehit'], ['Goals', 'goal'], ['Ball lost', 'lost']];
  return '<div class="ov" data-a="close"><div class="card" data-a="noop"><h2>Numbers</h2>' +
    '<table><thead><tr><th></th><th colspan="2">Q' + q + '</th><th colspan="2">Match</th></tr>' +
    '<tr><th></th><th>' + esc(S.home) + '</th><th>' + esc(S.away) + '</th><th>' + esc(S.home) + '</th><th>' + esc(S.away) + '</th></tr></thead><tbody>' +
    rows.map(r => '<tr><td>' + r[0] + '</td><td class="h">' + a.Home[r[1]] + '</td><td class="a">' + a.Away[r[1]] + '</td><td class="h">' + m.Home[r[1]] + '</td><td class="a">' + m.Away[r[1]] + '</td></tr>').join('') +
    '</tbody></table><div class="acts"><button class="btn p" data-a="close">Back to the match</button></div></div></div>';
}

function finishCard() {
  const c = counts(0), n = S.events.filter(e => e.kind !== 'qend').length;
  return '<div class="ov" data-a="close"><div class="card" data-a="noop"><h2>' + esc(S.home) + ' ' + c.Home.goal + ' – ' + c.Away.goal + ' ' + esc(S.away) + '</h2>' +
    '<p>' + n + ' events coded' + (S.finished ? '.' : '. The match is still open; you can send the file now and again later.') + ' File: <b>' + esc(fileName(S)) + '</b></p>' +
    '<label>Push-back time on the video (min:sec)</label>' +
    '<input id="f-off" inputmode="numeric" value="' + mmss(S.offset || 0).replace(/^0/, '') + '">' +
    '<p style="margin:8px 0 0">Leave 0:00 if the camera started at the push-back. This lines the clip times up with the video.</p>' +
    '<div class="acts"><button class="btn p" data-a="send">Send file</button><button class="btn" data-a="savefile">Save to this tablet</button>' +
    '<button class="btn" data-a="close">Back to the match</button><button class="btn d" data-a="newmatch">Close match</button></div></div></div>';
}

function render() {
  document.getElementById('app').innerHTML = S ? coderScreen() : setupScreen();
  tick();
}
function tick() {
  const a = document.getElementById('clk'), b = document.getElementById('clk2');
  if (!a || !S) return;
  if (S.q === 0) { a.textContent = 'Ready'; b.textContent = 'first tap starts Q1'; return; }
  const t = secs();
  a.textContent = S.finished ? 'Full time' : S.live ? 'Q' + S.q + ' ' + mmss(t - (S.qs[S.q] || 0)) : 'Break';
  b.textContent = 'running ' + mmss(t);
}

function readOffset() {
  const el = document.getElementById('f-off'); if (!el) return;
  const m = String(el.value).trim().match(/^(\d+)(?::(\d{1,2}))?$/);
  S.offset = m ? (+m[1]) * 60 + (+(m[2] || 0)) : 0; save();
}

function act(el) {
  const a = el.dataset.a;
  if (a === 'noop') return;
  if (a === 'begin') {
    const h = document.getElementById('f-home').value.trim(), w = document.getElementById('f-away').value.trim();
    if (!h || !w) { alert('Type both team names first.'); return; }
    S = fresh(h, w, document.getElementById('f-date').value || today()); hist = []; overlay = null; save(); render(); keepAwake(); return;
  }
  if (a === 'resend' || a === 'forget') {
    const list = saved(), i = +el.dataset.i;
    if (a === 'resend') return void send(list[i].match);
    if (confirm('Delete ' + list[i].home + ' v ' + list[i].away + ' from this tablet?')) { list.splice(i, 1); try { localStorage.setItem(DONE, JSON.stringify(list)); } catch (e) {} render(); }
    return;
  }
  if (!S) return;
  if (a === 'ev') {
    const d = el.dataset, x = {};
    if (d.loc) x.loc = d.loc;
    if (d.band !== undefined) x.band = +d.band;
    if (d.gf) x.gf = d.gf;
    return void add(d.k, d.s, x);
  }
  if (a === 'mark') return void add(el.dataset.k, null);
  if (a === 'quarter') return quarterTap();
  if (a === 'undo') return undo();
  if (a === 'del') return remove(+el.dataset.id);
  if (a === 'flip') { S.flipped = !S.flipped; save(); return render(); }
  if (a === 'numbers' || a === 'finish') { overlay = a; return render(); }
  if (a === 'close') { readOffset(); overlay = null; return render(); }
  if (a === 'send' || a === 'savefile') { readOffset(); return void send(S, a === 'savefile'); }
  if (a === 'newmatch') {
    readOffset();
    if (!confirm('Close this match? It stays in the list on this tablet, and you can send the file again from there.')) return;
    const c = counts(0), list = saved();
    list.unshift({date: S.date, home: S.home, away: S.away, score: c.Home.goal + '–' + c.Away.goal, match: S});
    try { localStorage.setItem(DONE, JSON.stringify(list.slice(0, 30))); } catch (e) {}
    S = null; hist = []; overlay = null; save(); render();
  }
}

document.addEventListener('pointerdown', ev => {
  const el = ev.target.closest('[data-a]');
  if (!el || el.disabled) return;
  if (el.dataset.a === 'noop') { if (!ev.target.closest('button,input')) return; }
  if (ev.target.closest('input')) return;
  const inner = ev.target.closest('button[data-a]') || el;
  const sig = (inner.dataset.key || inner.dataset.a) + (inner.dataset.id || '');
  const t = performance.now();
  if (sig === lastTap[0] && t - lastTap[1] < 300) return;      // a doubled touch
  lastTap = [sig, t];
  ev.preventDefault();
  act(inner);
});
window.addEventListener('beforeunload', ev => { if (S && S.events.length && !noSave) { ev.preventDefault(); ev.returnValue = ''; } });

let lock = null;
async function keepAwake() { try { if (S && 'wakeLock' in navigator && document.visibilityState === 'visible') lock = await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', keepAwake);

// ---------- self-test: a scripted match through the same code the buttons call ----------
function selfTest() {
  noSave = true; fake = Date.UTC(2027, 2, 5, 13, 0, 0);
  S = fresh('Kestrels', 'Northfield', '2027-03-05');
  let seed = 7; const rnd = n => { seed = (seed * 1103515245 + 12345) % 2147483648; return Math.floor(seed / 65536) % n; };
  const z = () => ({entry23: 0, dentry: 0, chance: 0, pc: 0, lc: 0, freehit: 0, goal: 0, toF: 0, toU: 0});
  const exp = {home: S.home, away: S.away, counts: {Home: z(), Away: z()}, sides: {Home: {}, Away: {}}, lost: {Home: [0, 0, 0, 0], Away: [0, 0, 0, 0]},
    byQ: {}, marks: {flag: 0, good: 0, bad: 0}, goalFrom: {'Field Goal': 0, 'PC/PS': 0}, undone: 0, deleted: 0};
  const menu = ['entry23', 'entry23', 'entry23', 'dentry', 'dentry', 'chance', 'chance', 'pc', 'lc', 'freehit', 'goal', 'toF', 'toF', 'toF', 'toU', 'toU', 'toU', 'flag', 'good', 'bad'];
  const LOCS = ['Left', 'Middle', 'Right'];
  const one = (tally) => {
    const kind = menu[rnd(menu.length)], side = rnd(2) ? 'Home' : 'Away', x = {};
    if (kind === 'flag' || kind === 'good' || kind === 'bad') { const e = add(kind, null); if (tally) exp.marks[kind]++; return e; }
    if (kind === 'entry23' || kind === 'dentry') x.loc = LOCS[rnd(3)];
    if (kind === 'toF' || kind === 'toU') x.band = rnd(4);
    if (kind === 'goal') x.gf = rnd(2) ? 'Field Goal' : 'PC/PS';
    const e = add(kind, side, x);
    if (tally) {
      exp.counts[side][kind]++;
      if (x.loc) exp.sides[side][kind + '|' + x.loc] = (exp.sides[side][kind + '|' + x.loc] || 0) + 1;
      if (x.band !== undefined) exp.lost[side][x.band]++;
      if (x.gf) exp.goalFrom[x.gf]++;
      const b = exp.byQ['Q' + e.q] = exp.byQ['Q' + e.q] || {Home: z(), Away: z()}; b[side][kind]++;
    }
    return e;
  };
  for (let q = 1; q <= 4; q++) {
    if (q !== 3) quarterTap();                         // Q3 is started by its first event, as a forgetful coder would
    for (let i = 0; i < 36; i++) {
      fake += (6 + rnd(38)) * 1000;
      if (i === 9) { one(false); undo(); exp.undone++; continue; }
      if (i === 20) { const e = one(false); remove(e.id); exp.deleted++; continue; }
      one(true);
    }
    fake += 15000; quarterTap(); fake += 120000;
  }
  S.offset = 95;
  render();
  const put = (id, text) => { const p = document.createElement('pre'); p.className = 'st'; p.id = id; p.textContent = text; document.body.appendChild(p); };
  put('st-xml', toXML(S)); put('st-expected', JSON.stringify(exp)); put('st-name', fileName(S));
}

// ---------- start ----------
if (/[?&]selftest/.test(location.search)) selfTest();
else {
  try { S = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { S = null; }
  render(); keepAwake();
  setInterval(tick, 500);
  if ('serviceWorker' in navigator && /^https:|^http:\/\/(localhost|127\.0\.0\.1)/.test(location.href)) navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
